<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Princess</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87CEEB;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
        }
    </style>
</head>

<body>

<canvas id="game"></canvas>

<script>

// ========================================
// CANVAS
// ========================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 960;
canvas.height = 540;


// ========================================
// WORLD SETTINGS
// ========================================

const WORLD_WIDTH = 4000;


// ========================================
// CAMERA
// ========================================

const camera = {
    x: 0,
    y: 0
};


// ========================================
// PLAYER
// ========================================

const player = {

    x: 100,
    y: 300,

    width: 32,
    height: 48,

    velocityX: 0,
    velocityY: 0,

    speed: 5,
    jumpPower: 12,

    grounded: false

};


// ========================================
// PHYSICS
// ========================================

const gravity = 0.6;


// ========================================
// CONTROLS
// ========================================

const keys = {};

document.addEventListener("keydown", (event) => {

    const key = event.key.toLowerCase();

    keys[key] = true;

    if (
        key === " " ||
        key === "arrowup" ||
        key === "arrowdown" ||
        key === "arrowleft" ||
        key === "arrowright"
    ) {
        event.preventDefault();
    }

    // Jump
    if (
        (
            key === " " ||
            key === "arrowup" ||
            key === "w"
        ) &&
        player.grounded
    ) {

        player.velocityY = -player.jumpPower;

        player.grounded = false;

    }

});


document.addEventListener("keyup", (event) => {

    keys[event.key.toLowerCase()] = false;

});


// ========================================
// LEVEL PLATFORMS
// ========================================

const platforms = [

    // Starting ground
    {
        x: 0,
        y: 470,
        width: 900,
        height: 70
    },

    // Platform 1
    {
        x: 1050,
        y: 400,
        width: 250,
        height: 25
    },

    // Platform 2
    {
        x: 1450,
        y: 350,
        width: 200,
        height: 25
    },

    // Platform 3
    {
        x: 1800,
        y: 420,
        width: 300,
        height: 25
    },

    // Platform 4
    {
        x: 2300,
        y: 330,
        width: 250,
        height: 25
    },

    // Platform 5
    {
        x: 2700,
        y: 400,
        width: 300,
        height: 25
    },

    // Final ground
    {
        x: 3200,
        y: 470,
        width: 800,
        height: 70
    }

];


// ========================================
// RESET PLAYER
// ========================================

function resetPlayer() {

    player.x = 100;
    player.y = 300;

    player.velocityX = 0;
    player.velocityY = 0;

}


// ========================================
// UPDATE PLAYER
// ========================================

function updatePlayer() {

    // ------------------------------------
    // Movement
    // ------------------------------------

    if (keys["arrowleft"] || keys["a"]) {

        player.velocityX = -player.speed;

    }

    else if (keys["arrowright"] || keys["d"]) {

        player.velocityX = player.speed;

    }

    else {

        player.velocityX *= 0.8;

    }


    // ------------------------------------
    // Gravity
    // ------------------------------------

    player.velocityY += gravity;


    // ------------------------------------
    // Move
    // ------------------------------------

    player.x += player.velocityX;
    player.y += player.velocityY;


    player.grounded = false;


    // ------------------------------------
    // Platform collision
    // ------------------------------------

    for (const platform of platforms) {

        const touchingPlatform =
            player.x < platform.x + platform.width &&
            player.x + player.width > platform.x &&
            player.y + player.height >= platform.y &&
            player.y + player.height <= platform.y + platform.height &&
            player.velocityY >= 0;


        if (touchingPlatform) {

            player.y =
                platform.y - player.height;

            player.velocityY = 0;

            player.grounded = true;

        }

    }


    // ------------------------------------
    // World boundaries
    // ------------------------------------

    if (player.x < 0) {

        player.x = 0;

    }


    if (player.x + player.width > WORLD_WIDTH) {

        player.x =
            WORLD_WIDTH - player.width;

    }


    // ------------------------------------
    // Falling
    // ------------------------------------

    if (player.y > canvas.height + 200) {

        resetPlayer();

    }

}


// ========================================
// UPDATE CAMERA
// ========================================

function updateCamera() {

    // Keep player around the middle of screen

    const targetX =
        player.x -
        canvas.width * 0.4;


    // Smooth camera movement

    camera.x +=
        (targetX - camera.x) * 0.08;


    // Don't scroll before beginning

    if (camera.x < 0) {

        camera.x = 0;

    }


    // Don't scroll beyond level

    const maxCameraX =
        WORLD_WIDTH -
        canvas.width;


    if (camera.x > maxCameraX) {

        camera.x = maxCameraX;

    }

}


// ========================================
// DRAW BACKGROUND
// ========================================

function drawBackground() {

    // Sky

    ctx.fillStyle = "#87CEEB";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Simple clouds

    ctx.fillStyle = "white";

    for (let i = 0; i < 12; i++) {

        const cloudX =
            i * 400 -
            camera.x * 0.25;

        const cloudY =
            70 +
            (i % 3) * 60;


        ctx.beginPath();

        ctx.arc(
            cloudX,
            cloudY,
            25,
            0,
            Math.PI * 2
        );

        ctx.arc(
            cloudX + 30,
            cloudY - 10,
            35,
            0,
            Math.PI * 2
        );

        ctx.arc(
            cloudX + 65,
            cloudY,
            25,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


// ========================================
// DRAW LEVEL
// ========================================

function drawLevel() {

    ctx.save();


    // Move world according to camera

    ctx.translate(
        -camera.x,
        -camera.y
    );


    // ------------------------------------
    // Platforms
    // ------------------------------------

    ctx.fillStyle = "#8B5A2B";

    for (const platform of platforms) {

        ctx.fillRect(
            platform.x,
            platform.y,
            platform.width,
            platform.height
        );

    }


    // ------------------------------------
    // Temporary player
    // ------------------------------------

    ctx.fillStyle = "#FF69B4";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );


    ctx.restore();

}


// ========================================
// DRAW
// ========================================

function draw() {

    drawBackground();

    drawLevel();

}


// ========================================
// GAME LOOP
// ========================================

function gameLoop() {

    updatePlayer();

    updateCamera();

    draw();

    requestAnimationFrame(gameLoop);

}


gameLoop();

</script>

</body>
</html>
