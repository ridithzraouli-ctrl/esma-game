<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Princess</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87CEEB;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
        }
    </style>
</head>

<body>

<canvas id="game"></canvas>

<script>

// ========================================
// CANVAS
// ========================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 960;
canvas.height = 540;


// ========================================
// PLAYER
// ========================================

const player = {
    x: 100,
    y: 300,

    width: 32,
    height: 48,

    velocityX: 0,
    velocityY: 0,

    speed: 5,
    jumpPower: 12,

    grounded: false
};


// ========================================
// PHYSICS
// ========================================

const gravity = 0.6;


// ========================================
// KEYBOARD INPUT
// ========================================

const keys = {};

document.addEventListener("keydown", (event) => {

    const key = event.key.toLowerCase();

    keys[key] = true;

    // Prevent the spacebar and arrow keys
    // from scrolling the browser.
    if (
        key === " " ||
        key === "arrowup" ||
        key === "arrowdown" ||
        key === "arrowleft" ||
        key === "arrowright"
    ) {
        event.preventDefault();
    }

    // Jump
    if (
        (
            key === " " ||
            key === "arrowup" ||
            key === "w"
        ) &&
        player.grounded
    ) {
        player.velocityY = -player.jumpPower;
        player.grounded = false;
    }

});

document.addEventListener("keyup", (event) => {

    keys[event.key.toLowerCase()] = false;

});


// ========================================
// LEVEL PLATFORMS
// ========================================

const platforms = [

    // Main ground
    {
        x: 0,
        y: 470,
        width: 960,
        height: 70
    },

    // First floating platform
    {
        x: 300,
        y: 380,
        width: 180,
        height: 25
    },

    // Second floating platform
    {
        x: 600,
        y: 300,
        width: 180,
        height: 25
    }

];


// ========================================
// UPDATE PLAYER
// ========================================

function update() {

    // ------------------------------------
    // Horizontal movement
    // ------------------------------------

    if (keys["arrowleft"] || keys["a"]) {

        player.velocityX = -player.speed;

    }

    else if (keys["arrowright"] || keys["d"]) {

        player.velocityX = player.speed;

    }

    else {

        // Gradually slow down
        player.velocityX *= 0.8;

    }


    // ------------------------------------
    // Gravity
    // ------------------------------------

    player.velocityY += gravity;


    // ------------------------------------
    // Move player
    // ------------------------------------

    player.x += player.velocityX;
    player.y += player.velocityY;


    // Assume player is in the air
    // until a platform collision proves otherwise.
    player.grounded = false;


    // ------------------------------------
    // Platform collision
    // ------------------------------------

    for (const platform of platforms) {

        const touchingPlatform =
            player.x < platform.x + platform.width &&
            player.x + player.width > platform.x &&
            player.y + player.height >= platform.y &&
            player.y + player.height <= platform.y + platform.height &&
            player.velocityY >= 0;


        if (touchingPlatform) {

            // Place player directly on top
            // of the platform.
            player.y = platform.y - player.height;

            // Stop downward movement.
            player.velocityY = 0;

            // Player is standing on something.
            player.grounded = true;

        }

    }


    // ------------------------------------
    // Left screen boundary
    // ------------------------------------

    if (player.x < 0) {

        player.x = 0;

    }


    // ------------------------------------
    // Right screen boundary
    // ------------------------------------

    if (player.x + player.width > canvas.width) {

        player.x = canvas.width - player.width;

    }

}


// ========================================
// DRAW GAME
// ========================================

function draw() {

    // ------------------------------------
    // Sky
    // ------------------------------------

    ctx.fillStyle = "#87CEEB";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // ------------------------------------
    // Ground
    // ------------------------------------

    ctx.fillStyle = "#5B9E48";

    ctx.fillRect(
        0,
        470,
        canvas.width,
        70
    );


    // ------------------------------------
    // Floating platforms
    // ------------------------------------

    ctx.fillStyle = "#8B5A2B";

    for (const platform of platforms) {

        ctx.fillRect(
            platform.x,
            platform.y,
            platform.width,
            platform.height
        );

    }


    // ------------------------------------
    // Temporary player
    // ------------------------------------

    ctx.fillStyle = "#FF69B4";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

}


// ========================================
// MAIN GAME LOOP
// ========================================

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
